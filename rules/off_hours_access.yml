title: Off-Hours Access
id: d2c3a5b6-7e8f-9a0b-1c2d-3e4f5a6b7c8d
status: experimental
description: Detects successful logins outside of normal business hours (00:00 - 05:00 UTC).
author: Antigravity SIEM
date: 2026-08-29
tags:
    - attack.initial_access
    - attack.t1078
logsource:
    category: authentication
