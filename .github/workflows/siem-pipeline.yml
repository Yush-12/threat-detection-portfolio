name: SIEM Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Log Generation
        run: |
          curl -X POST https://threatdetectionportfolio.vercel.app/api/generate
